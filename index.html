<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twibbon ST. Seterima Banjar Semaga</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--text:#2a1a0c;--muted:#7a6552;--line:#f0dcc6;--a:#ea6a0a;--btn:#c2410c;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a120a;--card:#241a10;--text:#fbeede;--muted:#c0a68c;--line:#3a2a1a;--btn:#f97316;--btnt:#1a120a}}
:root[data-theme="dark"]{--bg:#1a120a;--card:#241a10;--text:#fbeede;--muted:#c0a68c;--line:#3a2a1a;--btn:#f97316;--btnt:#1a120a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:8px 0 4px;text-align:center}
p.sub{margin:0 0 16px;text-align:center;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stage{width:100%;aspect-ratio:750/1280;border-radius:12px;overflow:hidden;background:var(--line)}
canvas,#res{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#res{display:none;cursor:default}
.row{display:flex;gap:10px;margin-top:14px;align-items:center}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--btn);color:var(--btnt);flex:1}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
label.f{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.9rem;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--a)}
input[type=text]{flex:1;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);min-width:0}
.hint{margin-top:10px;font-size:.85rem;color:var(--muted);text-align:center}
.cap{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem}
.cap b{display:block;margin-bottom:4px}
.cap textarea{width:100%;border:0;background:transparent;color:var(--text);font:inherit;resize:none;height:60px;outline:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Twibbon ST. Seterima Banjar Semaga</h1>
  <p class="sub">Unggah foto, atur posisinya, lalu unduh twibbon kamu.</p>
  <div class="card">
    <div class="stage"><canvas id="cv" width="750" height="1280"></canvas><img id="res" alt="Hasil twibbon"></div>
    <label class="f">Zoom <input type="range" id="zm" min="1" max="3" step="0.01" value="1" disabled></label>
    <label class="f">Nama <input type="text" id="nm" maxlength="32" placeholder="Nama kamu (opsional)"></label>
    <div class="row">
      <button class="sec" id="pick">Pilih foto</button>
      <button id="dl" disabled>Unduh</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="hint" id="hint">Geser foto untuk mengatur posisi.</div>
    <div class="cap"><b>Caption (siap salin)</b><textarea id="cap" readonly></textarea></div>
  </div>
</div>
<script>
var CFG={caption:"Bangga menjadi bagian dari ST. Seterima Banjar Semaga."};
var W=750,H=1280,WX=118,WY=228,WW=514,WH=730,R=44;
var cv=document.getElementById("cv"),cx=cv.getContext("2d");
var bg=new Image(),img=null,zoom=1,ox=0,oy=0,ready=false;
var zm=document.getElementById("zm"),dl=document.getElementById("dl"),file=document.getElementById("file"),nm=document.getElementById("nm");
document.getElementById("cap").value=CFG.caption;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(){
  var c=cx;
  document.getElementById("res").style.display="none";cv.style.display="block";
  c.clearRect(0,0,W,H);
  if(ready)c.drawImage(bg,0,0,W,H);else{c.fillStyle="#f97316";c.fillRect(0,0,W,H)}
  c.save();c.shadowColor="rgba(80,30,0,.45)";c.shadowBlur=28;c.shadowOffsetY=8;
  rr(c,WX,WY,WW,WH,R);c.fillStyle="#fff3e0";c.fill();c.restore();
  c.save();rr(c,WX,WY,WW,WH,R);c.clip();
  if(img){
    var cs=Math.max(WW/img.width,WH/img.height)*zoom,w=img.width*cs,h=img.height*cs;
    var mx=Math.max(0,(w-WW)/2),my=Math.max(0,(h-WH)/2);
    ox=Math.min(mx,Math.max(-mx,ox));oy=Math.min(my,Math.max(-my,oy));
    c.drawImage(img,WX+(WW-w)/2+ox,WY+(WH-h)/2+oy,w,h);
  }else{
    c.fillStyle="#9a6b3f";c.textAlign="center";c.font="600 30px system-ui,sans-serif";
    c.fillText("Foto kamu di sini",WX+WW/2,WY+WH/2);
  }
  c.restore();
  rr(c,WX,WY,WW,WH,R);c.lineWidth=8;c.strokeStyle="#fff3e0";c.stroke();
  var t=nm.value.trim();
  if(t){
    c.save();c.textAlign="center";c.fillStyle="#fff";c.shadowColor="rgba(80,30,0,.7)";c.shadowBlur=8;
    var s=46;c.font="800 "+s+"px system-ui,sans-serif";
    var m=c.measureText(t).width;if(m>560){s=Math.floor(s*560/m);c.font="800 "+s+"px system-ui,sans-serif"}
    c.fillText(t,W/2,WY+WH+74);c.restore();
  }
}
bg.onload=function(){ready=true;draw()};

function load(f){
  if(!f)return;
  var im=new Image();
  im.onload=function(){img=im;zoom=1;ox=oy=0;zm.value=1;zm.disabled=false;dl.disabled=false;
    document.getElementById("res").style.display="none";cv.style.display="block";draw()};
  im.src=URL.createObjectURL(f);
}
document.getElementById("pick").onclick=function(){file.click()};
file.onchange=function(){load(file.files[0])};
zm.oninput=function(){zoom=+zm.value;draw()};
nm.oninput=draw;
cv.addEventListener("wheel",function(e){if(!img)return;e.preventDefault();zoom=Math.min(3,Math.max(1,zoom-e.deltaY*0.0015));zm.value=zoom;draw()},{passive:false});
var drag=null;
cv.addEventListener("pointerdown",function(e){if(!img)return;drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",function(e){if(!drag)return;var k=W/cv.getBoundingClientRect().width;ox+=(e.clientX-drag.x)*k;oy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};draw()});
cv.addEventListener("pointerup",function(){drag=null});
cv.addEventListener("pointercancel",function(){drag=null});
dl.onclick=function(){
  if(!img)return;draw();
  cv.toBlob(async function(blob){
    var d=null;
    try{d=window.claude&&await window.claude.use("downloads")}catch(e){d=null}
    if(d){
      try{await d.save({filename:"twibbon-seterima.png",data:blob});document.getElementById("hint").textContent="Tersimpan. Selamat membagikan!";return}
      catch(e){if(e&&e.code==="declined")return}
    }
    try{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="twibbon-seterima.png";document.body.appendChild(a);a.click();a.remove()}catch(e){}
    var r=document.getElementById("res");r.src=cv.toDataURL("image/png");r.style.display="block";cv.style.display="none";
    document.getElementById("hint").textContent="Jika file belum terunduh, tekan lama (HP) atau klik kanan (komputer) pada gambar untuk menyimpan. Ubah zoom atau nama untuk mengedit lagi.";
  },"image/png");
};
